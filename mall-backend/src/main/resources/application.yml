server:
  port: 8080

spring:
  application:
    name: mall-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:2MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:3MB}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

mall:
  jwt:
    secret: ${JWT_SECRET:mall-course-demo-secret-key-change-me-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:/uploads}
    max-size-bytes: ${UPLOAD_MAX_SIZE_BYTES:2097152}
    allowed-extensions: ${UPLOAD_ALLOWED_EXTENSIONS:jpg,jpeg,png,webp}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
