server:
  port: 8080

spring:
  application:
    name: mall-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/mall_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:2MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:3MB}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

mall:
  jwt:
    secret: ${JWT_SECRET:mall-course-demo-secret-key-change-me-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:/uploads}
    max-size-bytes: ${UPLOAD_MAX_SIZE_BYTES:2097152}
    allowed-extensions: ${UPLOAD_ALLOWED_EXTENSIONS:jpg,jpeg,png,webp}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
